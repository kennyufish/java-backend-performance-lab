services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: performance_lab
      POSTGRES_USER: performance_lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-performance_lab}
    ports:
      - "${LAB_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U performance_lab -d performance_lab"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
    environment:
      LAB_DB_URL: jdbc:postgresql://postgres:5432/performance_lab
      LAB_DB_USERNAME: performance_lab
      LAB_DB_PASSWORD: ${LAB_DB_PASSWORD:-performance_lab}
    ports:
      - "${LAB_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
