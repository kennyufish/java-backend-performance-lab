name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: performance_lab
          POSTGRES_USER: performance_lab
          POSTGRES_PASSWORD: performance_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U performance_lab -d performance_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run integration tests and package
        env:
          LAB_DB_PASSWORD: performance_lab
        run: ./mvnw --batch-mode clean verify

      - name: Build and start the Compose stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Verify application health
        run: curl --fail --show-error http://localhost:8080/actuator/health

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the Compose stack
        if: always()
        run: docker compose down --volumes
